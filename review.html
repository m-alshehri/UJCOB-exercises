<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Review mistakes · tamareen</title>
    <link rel="stylesheet" href="/styles/shared.css" />
    <link rel="stylesheet" href="/styles/learning.css" />
  </head>
  <body class="learningPage">
    <div id="siteHeader"></div>
    <main id="main">
      <p class="eyebrow">LEARN FROM FEEDBACK</p>
      <h1>Review mistakes</h1>
      <p>
        Review all practiced concepts, including correct answers. Reviews are scheduled after 1, 3, 7, 14 and 30 days; a mistake brings the question back immediately.
      </p>
      <div class="actions">
        <label
          >Course<select id="reviewCourse">
            <option value="">All courses</option>
          </select></label
        ><label
          >Review status<select id="reviewState">
            <option value="true">Due for review</option>
            <option value="false">Reviewed</option>
            <option value="">All questions</option>
          </select></label
        ><button id="reviewPractice">Practice due questions</button>
      </div>
      <p id="reviewCount" role="status"></p>
      <div id="reviewList">Loading your saved answers…</div>
    </main>
    <div id="siteFooter"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
    <script src="/supabase-client.js"></script>
    <script src="/js/lab-content.js"></script>
    <script src="/js/catalog.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/learning.js"></script>
    <script src="/js/pathways.js"></script>
    <script src="/js/monitoring.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/review.js"></script>
  </body>
</html>
