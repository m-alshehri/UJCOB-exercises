<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCIS 324 · ERP Process Lab · tamareen</title><style>*{box-sizing:border-box;font-weight:400!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f9fb;color:#173746}.stripe{height:5px;background:linear-gradient(90deg,#004f6e,#83ccea,#08799c)}header{background:#fff;border-bottom:1px solid #dce9ee}.head,main{max-width:1100px;margin:auto}.head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.brand{color:#004f6e;font-size:22px;text-decoration:none}.back{color:#004f6e;background:#edf5f7;padding:10px 13px;border-radius:10px;text-decoration:none;font-size:13px}main{padding:34px 20px 70px}.ey{font-size:11px;letter-spacing:1.2px;color:#08799c}h1{color:#004f6e;margin:8px 0}.sub{color:#6b8089;line-height:1.7;max-width:760px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.stat{background:#fff;border:1px solid #dce9ee;border-radius:12px;padding:10px 14px;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid #cfe5ed;background:#fff;color:#004f6e;border-radius:999px;padding:8px 12px;cursor:pointer}.chip.on{background:#004f6e;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#fff;border:1px solid #dce9ee;border-radius:18px;padding:20px}.tag{font-size:10px;color:#08799c;letter-spacing:.7px}.card h3{margin:7px 0;color:#004f6e;font-size:16px}.card p{color:#6b8089;font-size:13px;line-height:1.6;min-height:42px}.task{background:#f7fcfe;border:1px solid #dce9ee;border-radius:12px;padding:13px;font-size:13px;line-height:1.6}.opts{display:grid;gap:7px;margin-top:12px}.opt{border:1px solid #dce9ee;background:#fff;border-radius:10px;padding:10px;text-align:left;cursor:pointer;color:#173746}.opt.good{border-color:#82cfb1;background:#effaf5}.opt.bad{border-color:#e5a0a0;background:#fff3f3}.feedback{font-size:12px;margin-top:9px;min-height:18px}.done{color:#147a54}.wrong{color:#b43d3d}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{padding:12px 14px}main{padding:26px 14px}}</style></head><body><div class="stripe"></div><header><div class="head"><a class="brand" href="/">tamareen</a><a class="back" href="/courses/bcis324">← Back to course</a></div></header><main><div class="ey">BCIS 324 · HANDS-ON LAB</div><h1>ERP Process Lab</h1><p class="sub">Practice integrated enterprise processes, shared data, module relationships and ERP implementation decisions through short business scenarios.</p><div class="stats"><div class="stat"><span id="done">0</span> / <span id="total"></span> completed</div><div class="stat">Instant feedback</div><div class="stat">Course-aligned scenarios</div></div><div class="filters"><button class="chip on" onclick="filter('All',this)">All</button><span id="chips"></span></div><div class="grid" id="grid"></div></main><script>const DATA=[{"cat":"Process Integration","title":"Order-to-Cash Flow","context":"An ERP integrates activities across functional areas.","q":"Which sequence best represents an integrated order-to-cash process?","options":["Sales order → delivery → billing → payment","Payment → purchase order → hiring → billing","Production → recruitment → payment → delivery","Billing → sales order → procurement → payroll"],"a":0,"explain":"Order-to-cash connects sales, fulfillment, billing and customer payment."},{"cat":"Process Integration","title":"Procure-to-Pay Flow","context":"Procurement transactions affect purchasing, inventory and finance.","q":"Which sequence is most appropriate?","options":["Purchase requisition → purchase order → goods receipt → invoice/payment","Invoice → sales order → payroll → goods receipt","Goods receipt → customer order → recruitment → payment","Payment → requisition → billing → delivery"],"a":0,"explain":"Procure-to-pay begins with a need and links purchasing, receipt, invoice and payment."},{"cat":"ERP Data","title":"Shared Master Data","context":"ERP modules rely on consistent enterprise data.","q":"A customer's address changes. What ERP design principle best avoids inconsistent copies across departments?","options":["Shared master data","Separate spreadsheets for every unit","Manual re-entry in each module","Independent databases with no integration"],"a":0,"explain":"Shared master data supports a consistent enterprise-wide view."},{"cat":"ERP Data","title":"Transaction Impact","context":"One transaction can update multiple parts of an ERP.","q":"A goods receipt is posted for purchased inventory. Which areas are most directly affected?","options":["Inventory and purchasing records, with possible financial impact","Only employee recruitment","Only marketing campaigns","Only customer service notes"],"a":0,"explain":"Integrated ERP transactions propagate relevant changes across connected functional areas."},{"cat":"ERP Implementation","title":"Fit vs Customization","context":"ERP implementation requires decisions about standard processes and customization.","q":"A firm wants to modify every ERP screen to match its old processes. Which concern should the team evaluate most carefully?","options":["Customization complexity and maintenance","Logo color","Office seating","Email signature format"],"a":0,"explain":"Heavy customization can increase implementation, upgrade and maintenance complexity."},{"cat":"ERP Implementation","title":"Change Management","context":"ERP changes processes and roles, not just software.","q":"Users understand the system technically but resist the new cross-functional process. What should the project strengthen?","options":["Change management and process training","Database deletion","More isolated spreadsheets","Removing process owners"],"a":0,"explain":"ERP success depends on organizational adoption and process change as well as technology."},{"cat":"Enterprise Systems","title":"ERP vs Siloed Systems","context":"Enterprise systems aim to coordinate information across functions.","q":"Which outcome most clearly demonstrates ERP integration?","options":["Sales and inventory use the same transaction data","Every department maintains unrelated customer IDs","Finance receives monthly paper copies only","Inventory cannot see sales demand"],"a":0,"explain":"Integration allows functions to share coordinated data and processes."},{"cat":"Enterprise Systems","title":"Module Connection","context":"ERP modules support different functional areas while sharing data.","q":"A confirmed customer order creates demand for inventory. Which connection is most relevant?","options":["Sales and inventory/planning","Payroll and recruitment only","Training and benefits only","Website colors and accounting"],"a":0,"explain":"Customer demand connects sales with inventory and planning activities."},{"cat":"Process Integration","title":"Process Bottleneck","context":"Cross-functional processes should be evaluated end-to-end.","q":"Orders are entered quickly but shipments are delayed because stock status is updated once a week. What is the integration issue?","options":["Inventory information is not timely across the process","The sales order has too many colors","Payroll runs monthly","The company has a website"],"a":0,"explain":"Integrated processes depend on timely shared information."},{"cat":"ERP Implementation","title":"Go-Live Readiness","context":"ERP projects require data, process and user readiness.","q":"Which combination is strongest evidence of go-live readiness?","options":["Validated data, tested processes, trained users","Untested interfaces and untrained users","Incomplete master data and no process owners","Only a finished logo"],"a":0,"explain":"ERP readiness is multi-dimensional: data, processes, technology and people."}];let solved=new Set();const cats=[...new Set(DATA.map(x=>x.cat))];document.getElementById('total').textContent=DATA.length;document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip" onclick="filter(\''+c+'\',this)">'+c+'</button>').join('');function render(list=DATA){document.getElementById('grid').innerHTML=list.map((x,i)=>{const real=DATA.indexOf(x);return '<div class="card"><div class="tag">'+x.cat.toUpperCase()+' · PRACTICE '+(real+1)+'</div><h3>'+x.title+'</h3><p>'+x.context+'</p><div class="task">'+x.q+'</div><div class="opts">'+x.options.map((o,j)=>'<button class="opt" onclick="check('+real+','+j+',this)">'+o+'</button>').join('')+'</div><div class="feedback" id="f'+real+'"></div></div>'}).join('')}function check(i,j,b){const x=DATA[i],card=b.closest('.card');card.querySelectorAll('.opt').forEach((el,k)=>{el.disabled=true;if(k===x.a)el.classList.add('good')});const f=document.getElementById('f'+i);if(j===x.a){solved.add(i);f.className='feedback done';f.textContent='Correct. '+x.explain}else{b.classList.add('bad');f.className='feedback wrong';f.textContent='Not quite. '+x.explain}document.getElementById('done').textContent=solved.size}function filter(c,b){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(c==='All'?DATA:DATA.filter(x=>x.cat===c))}render();</script></body></html>
