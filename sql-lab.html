<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCIS 311 SQL Coding Lab</title><script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script><style>*{box-sizing:border-box;font-weight:400!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;background:#f4f9fb;color:#173746}.top{height:6px;background:linear-gradient(90deg,#004f6e 58%,#83ccea 58%)}header{background:#fff;border-bottom:1px solid #dce9ee}.head,main{max-width:1160px;margin:auto;padding:18px 20px}.head{display:flex;justify-content:space-between;align-items:center}.brand{color:#004f6e;font-size:20px}.brand small{display:block;font-size:11px;color:#6b8089;margin-top:4px}a{color:#004f6e;text-decoration:none}.intro{margin:25px 0}.intro h1{color:#004f6e;margin-bottom:8px}.meta,.status{font-size:12px;color:#6b8089}.topics{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.topic{border:1px solid #dce9ee;background:#fff;border-radius:20px;padding:8px 12px;cursor:pointer}.topic.active{border-color:#83ccea;background:#eef9fc}.layout{display:grid;grid-template-columns:1fr 1.25fr;gap:18px}.card{background:#fff;border:1px solid #dce9ee;border-radius:18px;padding:26px}.qno{font-size:12px;color:#004f6e}.card h2{color:#004f6e}.example,.console{background:#f5f8fa;border:1px solid #dce9ee;padding:13px;border-radius:10px;font:400 13px/1.6 ui-monospace,monospace!important;white-space:pre-wrap}.editor{width:100%;min-height:260px;border:0;border-radius:12px;padding:18px;background:#17212b;color:#e8eef2;font:400 15px/1.65 ui-monospace,monospace!important;resize:vertical}.actions{text-align:right;margin-top:14px}.btn{border:0;border-radius:10px;padding:10px 15px;font-family:inherit;cursor:pointer;margin-left:6px}.pri{background:#004f6e;color:#fff}.sec{background:#edf5f7;color:#004f6e}.feedback{display:none;margin-top:15px;padding:13px;border-radius:10px}.good{display:block;background:#effaf5;color:#147a54}.bad{display:block;background:#fff3f3;color:#b43d3d}.status{margin:10px 0 18px}.ready{color:#147a54}table{border-collapse:collapse;width:100%;margin-top:8px;font-size:13px}th,td{border:1px solid #dce9ee;padding:7px;text-align:left}th{background:#edf5f7}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><div class="top"></div><header><div class="head"><div class="brand">جامعة جدة<small>UNIVERSITY OF JEDDAH · BCIS 311</small></div><a href="./">← Back to courses</a></div></header><main><div class="intro"><h1>SQL Coding Practice</h1><div class="meta">Write SQL queries, run them against a practice database, and check your result automatically.</div></div><div class="topics" id="topics"></div><div class="status" id="status">SQL engine will load when you run your first query.</div><div class="layout"><div class="card"><div class="qno" id="num"></div><h2 id="title"></h2><p id="desc"></p><div class="meta">Database schema / example</div><div class="example" id="example"></div><div class="feedback" id="feedback"></div></div><div class="card"><textarea class="editor" id="editor" spellcheck="false"></textarea><div class="actions"><button class="btn sec" onclick="resetCode()">Reset</button><button class="btn pri" id="run" onclick="runSQL()">Run & Check</button><button class="btn sec" onclick="nextCode()">Next exercise</button></div><div class="meta" style="margin-top:15px">Query result / test results</div><div class="console" id="console">Ready.</div></div></div></main><script>const E=[{t:'SELECT',n:'Retrieve all customers',d:'Write a query that returns every column and every row from the Customers table.',x:'Customers(CustomerID, Name, City)\nExpected rows: 5',s:'SELECT *\nFROM Customers;',q:'SELECT * FROM Customers'},{t:'SELECT',n:'Choose specific columns',d:'Return only Name and City from Customers, ordered by Name.',x:'Customers(CustomerID, Name, City)',s:'SELECT Name, City\nFROM Customers\nORDER BY Name;',q:'SELECT Name, City FROM Customers ORDER BY Name'},{t:'WHERE',n:'Filter customers by city',d:'Return Name for customers whose City is Jeddah, ordered by Name.',x:'Use a WHERE condition.',s:"SELECT Name\nFROM Customers\nWHERE City = 'Jeddah'\nORDER BY Name;",q:"SELECT Name FROM Customers WHERE City='Jeddah' ORDER BY Name"},{t:'WHERE',n:'Filter products by price',d:'Return ProductName and Price for products with a price greater than 100, ordered by Price descending.',x:'Products(ProductID, ProductName, Price)',s:'SELECT ProductName, Price\nFROM Products\nWHERE Price > 100\nORDER BY Price DESC;',q:'SELECT ProductName, Price FROM Products WHERE Price>100 ORDER BY Price DESC'},{t:'Aggregate',n:'Count customers',d:'Return the total number of customers. Name the result TotalCustomers.',x:'Use COUNT(*).',s:'SELECT COUNT(*) AS TotalCustomers\nFROM Customers;',q:'SELECT COUNT(*) AS TotalCustomers FROM Customers'},{t:'Aggregate',n:'Average product price',d:'Return the average product price. Name the result AveragePrice.',x:'Use AVG(Price).',s:'SELECT AVG(Price) AS AveragePrice\nFROM Products;',q:'SELECT AVG(Price) AS AveragePrice FROM Products'},{t:'GROUP BY',n:'Customers per city',d:'Return each City and the number of customers in it as CustomerCount. Order by City.',x:'Use GROUP BY City.',s:'SELECT City, COUNT(*) AS CustomerCount\nFROM Customers\nGROUP BY City\nORDER BY City;',q:'SELECT City, COUNT(*) AS CustomerCount FROM Customers GROUP BY City ORDER BY City'},{t:'JOIN',n:'Orders with customer names',d:'Return OrderID and customer Name for every order, ordered by OrderID.',x:'Orders.CustomerID references Customers.CustomerID.',s:'SELECT o.OrderID, c.Name\nFROM Orders o\nJOIN Customers c ON o.CustomerID = c.CustomerID\nORDER BY o.OrderID;',q:'SELECT o.OrderID, c.Name FROM Orders o JOIN Customers c ON o.CustomerID=c.CustomerID ORDER BY o.OrderID'},{t:'JOIN',n:'Order details with products',d:'Return OrderID, ProductName and Quantity from OrderItems joined to Products, ordered by OrderID then ProductName.',x:'OrderItems(OrderID, ProductID, Quantity)\nProducts(ProductID, ProductName, Price)',s:'SELECT oi.OrderID, p.ProductName, oi.Quantity\nFROM OrderItems oi\nJOIN Products p ON oi.ProductID = p.ProductID\nORDER BY oi.OrderID, p.ProductName;',q:'SELECT oi.OrderID, p.ProductName, oi.Quantity FROM OrderItems oi JOIN Products p ON oi.ProductID=p.ProductID ORDER BY oi.OrderID, p.ProductName'},{t:'Subqueries',n:'Products above average price',d:'Return ProductName and Price for products priced above the overall average, ordered by Price.',x:'Use a subquery with AVG(Price).',s:'SELECT ProductName, Price\nFROM Products\nWHERE Price > (SELECT AVG(Price) FROM Products)\nORDER BY Price;',q:'SELECT ProductName, Price FROM Products WHERE Price>(SELECT AVG(Price) FROM Products) ORDER BY Price'},{t:'INSERT/UPDATE',n:'Insert a new customer',d:'Insert CustomerID 6, Name "Nora", City "Jeddah" into Customers. The checker will verify the inserted row.',x:"Customers(CustomerID, Name, City)",s:"INSERT INTO Customers (CustomerID, Name, City)\nVALUES (6, 'Nora', 'Jeddah');",verify:"SELECT CustomerID,Name,City FROM Customers WHERE CustomerID=6",expected:[[6,'Nora','Jeddah']]},{t:'INSERT/UPDATE',n:'Update a product price',d:'Change the price of ProductID 2 to 150. The checker will verify the updated value.',x:'Products(ProductID, ProductName, Price)',s:'UPDATE Products\nSET Price = 150\nWHERE ProductID = 2;',verify:'SELECT Price FROM Products WHERE ProductID=2',expected:[[150]]}];let i=0,SQL=null;const $=x=>document.getElementById(x);function draw(){let e=E[i];$('num').textContent=`SQL EXERCISE ${i+1} OF ${E.length} · ${e.t}`;$('title').textContent=e.n;$('desc').textContent=e.d;$('example').textContent=e.x;$('editor').value=e.s;$('console').textContent='Ready.';$('feedback').className='feedback';let ts=[...new Set(E.map(x=>x.t))];$('topics').innerHTML=ts.map(t=>`<button class="topic ${e.t===t?'active':''}" onclick="jump('${t}')">${t}</button>`).join('')}function jump(t){i=E.findIndex(x=>x.t===t);draw()}function resetCode(){$('editor').value=E[i].s;$('console').textContent='Ready.';$('feedback').className='feedback'}function nextCode(){i=(i+1)%E.length;draw()}async function engine(){if(SQL)return SQL;if(typeof initSqlJs!=='function')throw Error('SQL.js loader did not load.');$('status').textContent='Loading SQL engine…';SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+f});$('status').className='status ready';$('status').textContent='SQL engine ready · queries run locally in this browser.';return SQL}function db(SQL){let d=new SQL.Database();d.run("CREATE TABLE Customers(CustomerID INTEGER PRIMARY KEY,Name TEXT,City TEXT);CREATE TABLE Products(ProductID INTEGER PRIMARY KEY,ProductName TEXT,Price REAL);CREATE TABLE Orders(OrderID INTEGER PRIMARY KEY,CustomerID INTEGER,OrderDate TEXT);CREATE TABLE OrderItems(OrderID INTEGER,ProductID INTEGER,Quantity INTEGER);INSERT INTO Customers VALUES(1,'Ahmed','Jeddah'),(2,'Sara','Riyadh'),(3,'Khalid','Jeddah'),(4,'Lina','Makkah'),(5,'Omar','Riyadh');INSERT INTO Products VALUES(1,'Keyboard',90),(2,'Mouse',75),(3,'Monitor',650),(4,'Headset',180),(5,'USB Cable',35);INSERT INTO Orders VALUES(101,1,'2026-09-01'),(102,2,'2026-09-02'),(103,1,'2026-09-03'),(104,3,'2026-09-04');INSERT INTO OrderItems VALUES(101,1,2),(101,2,1),(102,3,1),(103,4,2),(104,5,3);");return d}function rows(res){if(!res.length)return[];return res[res.length-1].values}function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}function table(res){if(!res.length)return'Query executed successfully. No result set returned.';let r=res[res.length-1],h='<table><tr>'+r.columns.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+r.values.map(v=>'<tr>'+v.map(x=>'<td>'+String(x)+'</td>').join('')+'</tr>').join('')+'</table>';return h}async function runSQL(){let b=$('run');b.disabled=true;$('feedback').className='feedback';try{let S=await engine(),e=E[i],student=db(S),answer=db(S),code=$('editor').value,got;if(e.verify){student.run(code);got=student.exec(e.verify);let actual=rows(got),ok=same(actual,e.expected);$('console').innerHTML=table(got);$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'Correct! The database state passed the test.':'Not correct yet. The resulting database state does not match the expected result.'}else{got=student.exec(code);let expected=answer.exec(e.q),ok=same(rows(got),rows(expected));$('console').innerHTML=table(got);$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'Correct! Your SQL query returned the expected result.':'Not correct yet. Compare your result with the requested columns, rows, filtering, and ordering.'}student.close();answer.close()}catch(err){$('console').textContent='SQL ERROR:\n'+String(err);$('feedback').className='feedback bad';$('feedback').textContent='SQL reported an error. Read the message below, correct the query, and try again.'}finally{b.disabled=false}}draw();</script></body></html>
