<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · tamareen</title><style>:root{--d:#004f6e;--l:#83ccea;--bg:#f4f9fb;--tx:#173746;--mu:#6b8089;--ln:#dce9ee;--bad:#b43d3d;--ok:#147a54}*{box-sizing:border-box;font-weight:400!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}header{background:#fffffff2;border-bottom:1px solid var(--ln)}.head,main{max-width:1160px;margin:auto}.head{padding:13px 20px;display:flex;justify-content:space-between;align-items:center}.brandwrap{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:13px;background:#082f40;display:grid;place-items:center;color:#8bdaf2;font:400 18px ui-monospace,SFMono-Regular,Menlo,monospace!important}.brand{color:var(--d);font-size:24px}.brand span{display:block;color:var(--mu);font-size:11px;margin-top:5px}.back{color:var(--d);text-decoration:none;font-size:13px}main{min-height:80vh;display:grid;place-items:center;padding:40px 20px}.box{width:min(430px,100%);background:#fff;border:1px solid var(--ln);border-radius:22px;padding:30px;box-shadow:0 12px 35px #004f6e10}.ey{font-size:12px;letter-spacing:1.3px;color:var(--d)}h1{margin:8px 0;font-size:31px}.sub{color:var(--mu);line-height:1.6;font-size:14px}.tabs{display:flex;background:#edf5f7;border-radius:11px;padding:4px;margin:20px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:8px;color:var(--d);cursor:pointer;font-family:inherit}.tabs button.active{background:#fff}.field{margin:13px 0}.field label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;font:400 14px inherit}.pri{width:100%;border:0;background:var(--d);color:#fff;border-radius:10px;padding:12px;cursor:pointer;font:400 14px inherit;margin-top:8px}.msg{min-height:20px;margin-top:14px;font-size:13px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}.note{color:var(--mu);font-size:11px;line-height:1.6;margin-top:18px}@media(max-width:500px){.box{padding:23px}}</style></head><body><header><div class="head"><div class="brandwrap"><div class="mark">&lt;/&gt;</div><div class="brand">tamareen<span>Interactive learning & self-assessment</span></div></div><a class="back" href="index.html">Back to courses</a></div></header><main><section class="box"><div class="ey">STUDENT ACCOUNT</div><h1 id="title">Login to tamareen</h1><p class="sub" id="sub">Sign in to save your attempts and follow your learning progress.</p><div class="tabs"><button id="loginTab" class="active" onclick="mode('login')">Login</button><button id="signupTab" onclick="mode('signup')">Sign up</button></div><div class="field" id="nameField" style="display:none"><label>Student name</label><input id="studentName" type="text" autocomplete="name" placeholder="Full name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="00000000@uj.edu.sa"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div><div class="field" id="confirmField" style="display:none"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password"></div><button class="pri" id="submit" onclick="submitAuth()">Login</button><div id="msg" class="msg"></div><div class="note">Your account is used to save quiz attempts, scores and learning activity. You can use the same account from different devices.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>let current='login';const p=new URLSearchParams(location.search),next=p.get('next')||'dashboard.html';function mode(m){current=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');title.textContent=m==='login'?'Login to tamareen':'Create your tamareen account';sub.textContent=m==='login'?'Sign in to save your attempts and follow your learning progress.':'Create a student account to save attempts and follow your progress across courses.';submit.textContent=m==='login'?'Login':'Create account';document.getElementById('nameField').style.display=m==='signup'?'block':'none';document.getElementById('confirmField').style.display=m==='signup'?'block':'none';document.getElementById('password').autocomplete=m==='signup'?'new-password':'current-password';msg.textContent='';msg.className='msg'}async function submitAuth(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,studentName=document.getElementById('studentName').value.trim(),confirmPassword=document.getElementById('confirmPassword').value;if(!email||!password){msg.textContent='Enter your email and password.';msg.className='msg err';return}if(current==='signup'&&!studentName){msg.textContent='Enter the student name.';msg.className='msg err';return}if(current==='signup'&&password!==confirmPassword){msg.textContent='Passwords do not match.';msg.className='msg err';return}submit.disabled=true;submit.textContent='Please wait…';try{const c=supabase.createClient(window.TAMAREEN_SUPABASE_URL,window.TAMAREEN_SUPABASE_PUBLISHABLE_KEY);if(current==='signup'){const r=await c.auth.signUp({email,password,options:{data:{student_name:studentName,full_name:studentName}}});if(r.error)throw r.error;if(!r.data.session){msg.textContent='Account created. Check your email to confirm your account, then log in.';msg.className='msg ok';mode('login')}else location.href=next}else{const r=await c.auth.signInWithPassword({email,password});if(r.error)throw r.error;location.href=next}}catch(e){msg.textContent=e.message||'Authentication failed.';msg.className='msg err'}finally{submit.disabled=false;submit.textContent=current==='login'?'Login':'Create account'}}</script></body></html>
