<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login · tamareen</title>
    <link rel="stylesheet" href="/styles/login.css" />
    <link rel="stylesheet" href="/styles/shared.css" />
    <link rel="stylesheet" href="/styles/learning.css" />
  </head>
  <body>
    <div id="siteHeader"></div>
    <div
      class="drawerBackdrop"
      id="drawerBackdrop"
      onclick="closeMobileNav()"
    ></div>
    <main id="main">
      <section class="box">
        <div class="ey">STUDENT ACCOUNT</div>
        <h1 id="title">Login to tamareen</h1>
        <p class="sub" id="sub">
          Sign in to save your attempts and follow your learning progress.
        </p>
        <div class="tabs">
          <button id="loginTab" class="active" onclick="mode('login')">
            Login</button
          ><button id="signupTab" onclick="mode('signup')">Sign up</button>
        </div>
        <div class="field" id="nameField" style="display: none">
          <label>Student name</label
          ><input
            id="studentName"
            type="text"
            autocomplete="name"
            placeholder="Full name"
          />
        </div>
        <div class="field">
          <label>Email</label
          ><input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="00000000@uj.edu.sa"
          />
        </div>
        <div class="field">
          <label>Password</label
          ><input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="At least 8 characters"
          />
        </div>
        <div class="field" id="confirmField" style="display: none">
          <label>Confirm password</label
          ><input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Re-enter your password"
          />
        </div>
        <button class="pri" id="submit" onclick="submitAuth()">Login</button>
        <div id="msg" class="msg"></div>
        <div class="note">
          Your account is used to save quiz attempts, scores and learning
          activity. You can use the same account from different devices.
        </div>
      </section>
    </main>
    <div id="siteFooter"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
    <script src="/supabase-client.js"></script>
    <script src="/js/lab-content.js"></script>
    <script src="/js/catalog.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/learning.js"></script>
    <script src="/js/pathways.js"></script>
    <script src="/js/monitoring.js"></script>
    <script src="/js/progress.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
