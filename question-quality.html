<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Question quality · tamareen</title>
    <link rel="stylesheet" href="/styles/shared.css" />
    <link rel="stylesheet" href="/styles/learning.css" />
  </head>
  <body class="learningPage">
    <div id="siteHeader"></div>
    <main id="main">
      <h1>Question quality</h1>
      <p>
        Latest completed answer per learner and question. Fewer than 5 learners
        is insufficient evidence; low accuracy alone does not mean a question is
        wrong.
      </p>
      <label>Search questions<input id="qualitySearch" type="search" /></label
      ><label
        >Course<select id="qualityCourse">
          <option value="">All courses</option>
        </select></label
      ><label
        ><input type="checkbox" id="reportedOnly" />Unresolved reports
        only</label
      >
      <p id="qualityStatus" role="status">Loading…</p>
      <div id="qualityList"></div>
    </main>
    <div id="siteFooter"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>

    <script src="/question-banks.js"></script>
    <script src="/js/lab-content.js"></script>
    <script src="/js/catalog.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/learning.js"></script>
    <script src="/js/pathways.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/monitoring.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/question-quality.js"></script>
  </body>
</html>
