<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCIS 421 · Data Analytics Lab · tamareen</title><style>*{box-sizing:border-box;font-weight:400!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f9fb;color:#173746}.stripe{height:5px;background:linear-gradient(90deg,#004f6e,#83ccea,#08799c)}header{background:#fff;border-bottom:1px solid #dce9ee}.head,main{max-width:1100px;margin:auto}.head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.brand{color:#004f6e;font-size:22px;text-decoration:none}.back{color:#004f6e;background:#edf5f7;padding:10px 13px;border-radius:10px;text-decoration:none;font-size:13px}main{padding:34px 20px 70px}.ey{font-size:11px;letter-spacing:1.2px;color:#08799c}h1{color:#004f6e;margin:8px 0}.sub{color:#6b8089;line-height:1.7;max-width:760px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.stat{background:#fff;border:1px solid #dce9ee;border-radius:12px;padding:10px 14px;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid #cfe5ed;background:#fff;color:#004f6e;border-radius:999px;padding:8px 12px;cursor:pointer}.chip.on{background:#004f6e;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#fff;border:1px solid #dce9ee;border-radius:18px;padding:20px}.tag{font-size:10px;color:#08799c;letter-spacing:.7px}.card h3{margin:7px 0;color:#004f6e;font-size:16px}.card p{color:#6b8089;font-size:13px;line-height:1.6;min-height:42px}.task{background:#f7fcfe;border:1px solid #dce9ee;border-radius:12px;padding:13px;font-size:13px;line-height:1.6}.opts{display:grid;gap:7px;margin-top:12px}.opt{border:1px solid #dce9ee;background:#fff;border-radius:10px;padding:10px;text-align:left;cursor:pointer;color:#173746}.opt.good{border-color:#82cfb1;background:#effaf5}.opt.bad{border-color:#e5a0a0;background:#fff3f3}.feedback{font-size:12px;margin-top:9px;min-height:18px}.done{color:#147a54}.wrong{color:#b43d3d}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{padding:12px 14px}main{padding:26px 14px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><script>(async()=>{try{const c=supabase.createClient(window.TAMAREEN_SUPABASE_URL,window.TAMAREEN_SUPABASE_PUBLISHABLE_KEY);const {data}=await c.auth.getSession();if(!data?.session)location.replace('/login.html?next='+encodeURIComponent(location.pathname+location.search))}catch(e){location.replace('/login.html?next='+encodeURIComponent(location.pathname+location.search))}})();</script></head><body><div class="stripe"></div><header><div class="head"><a class="brand" href="/">tamareen</a><a class="back" href="/courses/bcis421">← Back to course</a></div></header><main><div class="ey">BCIS 421 · HANDS-ON LAB</div><h1>Data Analytics Lab</h1><p class="sub">Practice data preparation, descriptive and predictive analytics, model evaluation and prescriptive decision scenarios aligned with the course.</p><div class="stats"><div class="stat"><span id="done">0</span> / <span id="total"></span> completed</div><div class="stat">Instant feedback</div><div class="stat">Course-aligned scenarios</div></div><div class="filters"><button class="chip on" onclick="filter('All',this)">All</button><span id="chips"></span></div><div class="grid" id="grid"></div></main><script>const DATA=[{"cat":"Data Preparation","title":"Missing Values","context":"Analytics begins with understanding and preparing data.","q":"A numeric field has a small number of missing values. What should an analyst do first?","options":["Assess why values are missing and choose a justified treatment","Always replace them with zero","Delete the entire dataset","Ignore the issue without checking"],"a":0,"explain":"Missing-data treatment should follow assessment of the pattern, meaning and analytical context."},{"cat":"Data Preparation","title":"Train/Test Separation","context":"Predictive models should be evaluated on data not used to fit them.","q":"Why keep a test set separate from model training?","options":["To estimate performance on unseen data","To make the training set larger","To guarantee perfect accuracy","To remove the target variable"],"a":0,"explain":"A held-out test set provides a better estimate of generalization."},{"cat":"Descriptive Analytics","title":"Central Tendency","context":"Summary statistics describe data distributions.","q":"Which statistic is generally less sensitive to extreme outliers?","options":["Median","Mean","Sum","Range"],"a":0,"explain":"The median depends on order and is typically more robust to extreme values."},{"cat":"Descriptive Analytics","title":"Correlation","context":"Association does not automatically establish cause.","q":"Two variables have a strong correlation. What can you conclude safely?","options":["They are associated, but correlation alone does not prove causation","One definitely causes the other","The data must be wrong","They are identical variables"],"a":0,"explain":"Correlation quantifies association; causal conclusions require additional evidence/design."},{"cat":"Predictive Analytics","title":"Classification Task","context":"Classification predicts categorical outcomes.","q":"Which problem is a classification problem?","options":["Predict whether a customer will churn: yes/no","Predict exact monthly revenue","Calculate an average","Sort rows alphabetically"],"a":0,"explain":"Churn yes/no is a categorical target."},{"cat":"Predictive Analytics","title":"Regression Task","context":"Regression commonly predicts continuous numeric outcomes.","q":"Which problem is most naturally regression?","options":["Predict next month's sales amount","Predict spam/not spam","Group customers without labels","Count missing cells"],"a":0,"explain":"Sales amount is a continuous numeric target."},{"cat":"Model Evaluation","title":"Confusion Matrix","context":"Classification evaluation distinguishes types of correct and incorrect predictions.","q":"Which evaluation tool summarizes true/false positives and true/false negatives?","options":["Confusion matrix","Histogram only","ER diagram","Gantt chart"],"a":0,"explain":"A confusion matrix organizes classification outcomes by actual and predicted class."},{"cat":"Model Evaluation","title":"Overfitting","context":"A model can fit training data well but generalize poorly.","q":"Training accuracy is 99% but test accuracy is 68%. What is a likely concern?","options":["Overfitting","Perfect generalization","Missing target definition is impossible","The test set trained the model"],"a":0,"explain":"A large training-test performance gap is a common signal of overfitting."},{"cat":"Prescriptive Analytics","title":"Optimization Decision","context":"Prescriptive analytics supports choosing actions under objectives and constraints.","q":"A company must allocate a limited budget across projects to maximize expected return. What type of analytics is most relevant?","options":["Prescriptive/optimization","Descriptive only","Data entry","File compression"],"a":0,"explain":"Allocation under an objective and constraints is a prescriptive optimization problem."},{"cat":"Analytics Process","title":"Business Understanding","context":"Analytics should begin with a clearly framed business problem.","q":"Before selecting an algorithm, what should the team establish?","options":["Business objective, target decision and success criteria","A favorite algorithm regardless of problem","Dashboard colors only","The final result before examining data"],"a":0,"explain":"Problem framing guides data needs, method selection and evaluation."}];let solved=new Set();const COURSE='BCIS 421',LAB='analytics-lab';let sb=null,user=null,courseId=null;async function initProgress(){try{sb=supabase.createClient(window.TAMAREEN_SUPABASE_URL,window.TAMAREEN_SUPABASE_PUBLISHABLE_KEY);const {data:ss}=await sb.auth.getSession();user=ss?.session?.user||null;if(!user)return;const {data:co}=await sb.from('courses').select('id').eq('code',COURSE).single();courseId=co?.id;if(!courseId)return;const {data:p}=await sb.from('lab_progress').select('exercise_key').eq('user_id',user.id).eq('course_id',courseId).eq('lab_type',LAB).eq('completed',true);(p||[]).forEach(x=>solved.add(Number(x.exercise_key)));document.getElementById('done').textContent=solved.size}catch(e){console.warn('Progress sync unavailable',e)}}async function saveProgress(n){solved.add(n);document.getElementById('done').textContent=solved.size;if(!user||!courseId)return;try{await sb.from('lab_progress').upsert({user_id:user.id,course_id:courseId,lab_type:LAB,exercise_key:String(n),exercise_title:DATA[n]?.title||'',completed:true,completed_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id,course_id,lab_type,exercise_key'})}catch(e){console.warn('Progress save failed',e)}}const cats=[...new Set(DATA.map(x=>x.cat))];document.getElementById('total').textContent=DATA.length;document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip" onclick="filter(\''+c+'\',this)">'+c+'</button>').join('');function render(list=DATA){document.getElementById('grid').innerHTML=list.map((x,i)=>{const real=DATA.indexOf(x);return '<div class="card"><div class="tag">'+x.cat.toUpperCase()+' · PRACTICE '+(real+1)+'</div><h3>'+x.title+'</h3><p>'+x.context+'</p><div class="task">'+x.q+'</div><div class="opts">'+x.options.map((o,j)=>'<button class="opt" onclick="check('+real+','+j+',this)">'+o+'</button>').join('')+'</div><div class="feedback" id="f'+real+'"></div></div>'}).join('')}function check(i,j,b){const x=DATA[i],card=b.closest('.card');card.querySelectorAll('.opt').forEach((el,k)=>{el.disabled=true;if(k===x.a)el.classList.add('good')});const f=document.getElementById('f'+i);if(j===x.a){saveProgress(i);f.className='feedback done';f.textContent='Correct. '+x.explain}else{b.classList.add('bad');f.className='feedback wrong';f.textContent='Not quite. '+x.explain}document.getElementById('done').textContent=solved.size}function filter(c,b){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(c==='All'?DATA:DATA.filter(x=>x.cat===c))}render();initProgress();</script></body></html>
