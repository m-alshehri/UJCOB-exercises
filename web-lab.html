<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Coding Lab · tamareen</title><style>
:root{--d:#004f6e;--l:#83ccea;--bg:#f4f9fb;--tx:#173746;--mu:#6b8089;--ln:#dce9ee}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}header{background:#fff;border-bottom:1px solid var(--ln);padding:14px 20px;position:sticky;top:0;z-index:3}.head{max-width:1160px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;color:var(--d);text-decoration:none}.btn{border:0;border-radius:10px;padding:10px 13px;background:#edf5f7;color:var(--d);cursor:pointer}.pri{background:var(--d);color:#fff}main{max-width:1160px;margin:auto;padding:28px 20px 60px}.eyebrow{font-size:12px;color:#08799c}.top h1{margin:6px 0}.top p{color:var(--mu)}.exercise{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:18px;margin:18px 0}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--ln);border-radius:16px;overflow:hidden}.panel h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--ln);font-size:13px;color:var(--d)}textarea{width:100%;height:420px;border:0;resize:vertical;padding:16px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;outline:0;background:#082f40;color:#d9edf4}iframe{width:100%;height:420px;border:0;background:#fff}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.status{margin-top:12px;padding:12px;border-radius:10px;background:#edf5f7}.good{background:#effaf5;color:#147a54}.meta{font-size:12px;color:var(--mu)}@media(max-width:720px){main{padding:20px 14px}.workspace{grid-template-columns:1fr}textarea,iframe{height:330px}.head{gap:10px}.top h1{font-size:27px}.actions .btn{flex:1}}
</style></head><body><header><div class="head"><a class="brand" href="index.html">tamareen</a><a class="btn" href="index.html">Courses</a></div></header><main><div class="top"><div class="eyebrow">BCIS 317 · CODE PRACTICE</div><h1>Web Coding Lab</h1><p>Write HTML, CSS and JavaScript and see the result instantly.</p></div><div class="exercise"><div class="meta" id="count"></div><h2 id="title"></h2><p id="task"></p></div><div class="workspace"><div class="panel"><h3>HTML · CSS · JavaScript</h3><textarea id="code" spellcheck="false"></textarea></div><div class="panel"><h3>Live Preview</h3><iframe id="preview" sandbox="allow-scripts"></iframe></div></div><div class="actions"><button class="btn pri" onclick="run()">Run code</button><button class="btn" onclick="check()">Check task</button><button class="btn" onclick="reset()">Reset</button><button class="btn" onclick="next()">Next exercise</button></div><div id="status" class="status">Edit the code, then run and check your work.</div></main><script>
const E=[
['Build a heading','Create an H1 heading containing the text Welcome to Tamareen.','<!doctype html>\n<html>\n<head><style>body{font-family:Arial;padding:30px}</style></head>\n<body>\n<!-- Add your H1 here -->\n</body>\n</html>',s=>/<h1[^>]*>\s*Welcome to Tamareen\s*<\/h1>/i.test(s)],
['Style a button','Create a button and use CSS to give it padding and a border-radius.','<!doctype html>\n<html>\n<head><style>\n/* Style the button */\n</style></head>\n<body>\n<button>Start Practice</button>\n</body>\n</html>',s=>/<button/i.test(s)&&/padding\s*:/i.test(s)&&/border-radius\s*:/i.test(s)],
['Create a link','Add a hyperlink to https://tamareen.online with the visible text Tamareen.','<!doctype html>\n<html>\n<body>\n<!-- Add the link here -->\n</body>\n</html>',s=>/<a[^>]+href=["']https:\/\/tamareen\.online\/?["'][^>]*>\s*Tamareen\s*<\/a>/i.test(s)],
['JavaScript interaction','Create a button that changes the paragraph text when clicked.','<!doctype html>\n<html>\n<body>\n<p id="message">Ready</p>\n<button onclick="changeText()">Change text</button>\n<script>\nfunction changeText(){\n  // Change #message text here\n}\n<\/script>\n</body>\n</html>',s=>/getElementById\s*\(\s*["']message["']\s*\)/i.test(s)&&/(textContent|innerText|innerHTML)\s*=/i.test(s)],
['Responsive layout','Create a CSS media query for screens up to 600px wide.','<!doctype html>\n<html>\n<head><style>\n.container{display:grid;grid-template-columns:1fr 1fr}\n/* Add a mobile media query */\n</style></head>\n<body><div class="container"><div>One</div><div>Two</div></div></body>\n</html>',s=>/@media\s*\([^)]*max-width\s*:\s*600px/i.test(s)]
];let i=0;const $=x=>document.getElementById(x);function draw(){$('count').textContent='Exercise '+(i+1)+' of '+E.length;$('title').textContent=E[i][0];$('task').textContent=E[i][1];$('code').value=E[i][2];$('status').className='status';$('status').textContent='Edit the code, then run and check your work.';run()}function run(){$('preview').srcdoc=$('code').value}function check(){run();const ok=E[i][3]($('code').value);$('status').className='status'+(ok?' good':'');$('status').textContent=ok?'Correct! Your code satisfies this task.':'Not complete yet. Review the task and try again.'}function reset(){draw()}function next(){i=(i+1)%E.length;draw()}let t; $('code').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(run,350)});draw();
</script></body></html>
