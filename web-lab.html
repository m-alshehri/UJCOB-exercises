<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Web Coding Lab · tamareen</title>
    <link rel="stylesheet" href="/styles/web-lab.css" />
    <link rel="stylesheet" href="/styles/shared.css" />
  </head>
  <body>
    <div id="siteHeader"></div>
    <div
      class="drawerBackdrop"
      id="drawerBackdrop"
      onclick="closeMobileNav()"
    ></div>
    <main>
      <div class="top">
        <div class="eyebrow">BCIS 317 · CODE PRACTICE</div>
        <h1>Web Coding Lab</h1>
        <p>Write HTML, CSS and JavaScript and see the result instantly.</p>
      </div>
      <div class="exercise">
        <div class="meta" id="count"></div>
        <h2 id="title"></h2>
        <p id="task"></p>
      </div>
      <div class="workspace">
        <div class="panel">
          <h3>HTML · CSS · JavaScript</h3>
          <textarea id="code" spellcheck="false"></textarea>
        </div>
        <div class="panel">
          <h3>Live Preview</h3>
          <iframe id="preview" sandbox="allow-scripts"></iframe>
        </div>
      </div>
      <div class="actions">
        <button class="btn pri" onclick="run()">Run code</button
        ><button class="btn" onclick="check()">Check task</button
        ><button class="btn" onclick="reset()">Reset</button
        ><button class="btn" onclick="next()">Next exercise</button>
      </div>
      <div id="status" class="status">
        Edit the code, then run and check your work.
      </div>
    </main>
    <div id="siteFooter"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
    <script src="/supabase-client.js"></script>
    <script src="/js/lab-content.js"></script>
    <script src="/js/catalog.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/progress.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/web-lab.js"></script>
  </body>
</html>
