<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCIS 313 Python Coding Lab</title><script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script><style>*{box-sizing:border-box;font-weight:400!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;background:#f4f9fb;color:#173746}.top{height:6px;background:linear-gradient(90deg,#004f6e 58%,#83ccea 58%)}header{background:#fff;border-bottom:1px solid #dce9ee}.head,main{max-width:1160px;margin:auto;padding:18px 20px}.head{display:flex;justify-content:space-between;align-items:center}.brand{color:#004f6e;font-size:20px}.brand small{display:block;font-size:11px;color:#6b8089;margin-top:4px}a{color:#004f6e;text-decoration:none}.intro{margin:25px 0}.intro h1{color:#004f6e;margin-bottom:8px}.meta,.status{font-size:12px;color:#6b8089}.topics{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.topic{border:1px solid #dce9ee;background:#fff;border-radius:20px;padding:8px 12px;cursor:pointer}.topic.active{border-color:#83ccea;background:#eef9fc}.layout{display:grid;grid-template-columns:1fr 1.25fr;gap:18px}.card{background:#fff;border:1px solid #dce9ee;border-radius:18px;padding:26px}.qno{font-size:12px;color:#004f6e}.card h2{color:#004f6e}.example,.console{background:#f5f8fa;border:1px solid #dce9ee;padding:13px;border-radius:10px;font:400 13px/1.6 ui-monospace,monospace!important;white-space:pre-wrap}.editor{width:100%;min-height:300px;border:0;border-radius:12px;padding:18px;background:#17212b;color:#e8eef2;font:400 15px/1.65 ui-monospace,monospace!important;resize:vertical}.actions{text-align:right;margin-top:14px}.btn{border:0;border-radius:10px;padding:10px 15px;font-family:inherit;cursor:pointer;margin-left:6px}.pri{background:#004f6e;color:#fff}.sec{background:#edf5f7;color:#004f6e}.feedback{display:none;margin-top:15px;padding:13px;border-radius:10px}.good{display:block;background:#effaf5;color:#147a54}.bad{display:block;background:#fff3f3;color:#b43d3d}.status{margin:10px 0 18px}.ready{color:#147a54}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><div class="top"></div><header><div class="head"><div class="brand">جامعة جدة<small>UNIVERSITY OF JEDDAH · BCIS 313</small></div><a href="./">← Back to courses</a></div></header><main><div class="intro"><h1>Python Coding Practice</h1><div class="meta">Write real Python code and check your solution against automatic test cases.</div></div><div class="topics" id="topics"></div><div class="status" id="status">Python engine not loaded yet. It will load on your first run.</div><div class="layout"><div class="card"><div class="qno" id="num"></div><h2 id="title"></h2><p id="desc"></p><div class="meta">Example</div><div class="example" id="example"></div><div class="feedback" id="feedback"></div></div><div class="card"><textarea class="editor" id="editor" spellcheck="false"></textarea><div class="actions"><button class="btn sec" onclick="resetCode()">Reset</button><button class="btn pri" id="run" onclick="runCode()">Run & Check</button><button class="btn sec" onclick="nextCode()">Next exercise</button></div><div class="meta" style="margin-top:15px">Console / test results</div><div class="console" id="console">Ready.</div></div></div></main><script>const E=[{t:'Basics',n:'Print a message',d:'Write Python code that prints exactly: Hello, UJ!',x:'Output:\nHello, UJ!',s:'# Write your code here\n',z:[['out','Hello, UJ!']]},{t:'Basics',n:'Variables and arithmetic',d:'Create price = 80 and quantity = 3, then print their product.',x:'Output:\n240',s:'price = 80\nquantity = 3\n# print the total\n',z:[['out','240']]},{t:'Conditions',n:'Positive, negative, or zero',d:'Set number = -4. Print Positive, Negative, or Zero as appropriate.',x:'Output:\nNegative',s:'number = -4\n# write your condition\n',z:[['out','Negative']]},{t:'Loops',n:'Count from 1 to 5',d:'Use a loop to print 1 through 5, each on a new line.',x:'Output:\n1\n2\n3\n4\n5',s:'# use a for loop\n',z:[['out','1\n2\n3\n4\n5']]},{t:'Loops',n:'Sum a range',d:'Use a loop to calculate and print the sum of integers 1 through 10.',x:'Output:\n55',s:'total = 0\n# use a loop\n',z:[['out','55']]},{t:'Functions',n:'Calculate revenue',d:'Define revenue(price, quantity) that returns price × quantity.',x:'revenue(25, 4) → 100',s:'def revenue(price, quantity):\n    pass\n',z:[['expr','revenue(25,4)',100],['expr','revenue(12.5,2)',25]]},{t:'Strings',n:'Normalize a customer name',d:'Define clean_name(name) that strips outer spaces and converts to title case.',x:'clean_name("  sara ali ") → "Sara Ali"',s:'def clean_name(name):\n    pass\n',z:[['expr','clean_name("  sara ali ")','Sara Ali'],['expr','clean_name("MOHAMMAD")','Mohammad']]},{t:'Lists',n:'Average sales',d:'Define average_sales(sales) that returns the arithmetic mean.',x:'average_sales([100,200,300]) → 200.0',s:'def average_sales(sales):\n    pass\n',z:[['expr','average_sales([100,200,300])',200],['expr','average_sales([10,20])',15]]},{t:'Dictionaries',n:'Calculate order total',d:'Define order_total(order). The dictionary has price and quantity keys. Return price × quantity.',x:'order_total({"price":20,"quantity":3}) → 60',s:'def order_total(order):\n    pass\n',z:[['expr','order_total({"price":20,"quantity":3})',60],['expr','order_total({"price":7.5,"quantity":4})',30]]}];let i=0,py=null;const $=x=>document.getElementById(x);function draw(){let q=E[i];$('num').textContent=`CODING EXERCISE ${i+1} OF ${E.length} · ${q.t}`;$('title').textContent=q.n;$('desc').textContent=q.d;$('example').textContent=q.x;$('editor').value=q.s;$('console').textContent='Ready.';$('feedback').className='feedback';let ts=[...new Set(E.map(q=>q.t))];$('topics').innerHTML=ts.map(t=>`<button class="topic ${q.t===t?'active':''}" onclick="jump('${t}')">${t}</button>`).join('')}function jump(t){i=E.findIndex(q=>q.t===t);draw()}function resetCode(){$('editor').value=E[i].s;$('console').textContent='Ready.';$('feedback').className='feedback'}function nextCode(){i=(i+1)%E.length;draw()}async function engine(){if(py)return py;if(typeof loadPyodide!=='function')throw new Error('Pyodide loader script did not load from jsDelivr.');$('status').textContent='Loading Python engine…';py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});let test=py.runPython('1 + 1');if(test!==2)throw new Error('Python engine self-test failed.');$('status').className='status ready';$('status').textContent='Python engine ready · self-test passed · code runs locally in this browser.';return py}async function runCode(){let b=$('run');b.disabled=true;$('console').textContent='Running…';try{let p=await engine(),q=E[i],code=$('editor').value;p.globals.set('USER_CODE',code);p.globals.set('TESTS',JSON.stringify(q.z));let raw=await p.runPythonAsync(`import io,contextlib,json,traceback\nout=io.StringIO()\ntry:\n ns={}\n with contextlib.redirect_stdout(out): exec(USER_CODE,ns)\n printed=out.getvalue().strip()\n rr=[]\n for t in json.loads(TESTS):\n  if t[0]=='out': got,expected=printed,t[1]\n  else: got,expected=eval(t[1],ns),t[2]\n  ok=(got==expected) or (isinstance(got,(int,float)) and isinstance(expected,(int,float)) and abs(got-expected)<1e-9)\n  rr.append([ok,repr(got),repr(expected)])\n json.dumps({'ok':all(r[0] for r in rr),'r':rr,'printed':printed})\nexcept Exception:\n json.dumps({'ok':False,'error':traceback.format_exc(),'printed':out.getvalue().strip()})`);let r=JSON.parse(raw);if(r.error){$('console').textContent=r.error;$('feedback').className='feedback bad';$('feedback').textContent='Python reported an error. Read the traceback and correct your code.'}else{$('console').textContent=r.r.map((a,j)=>`Test ${j+1}: ${a[0]?'PASS':'FAIL'} · got ${a[1]} · expected ${a[2]}`).join('\n')+(r.printed?'\n\nProgram output:\n'+r.printed:'');$('feedback').className='feedback '+(r.ok?'good':'bad');$('feedback').textContent=r.ok?'Correct! Your solution passed all test cases.':'Not correct yet. Review the failed test case(s) and try again.'}}catch(e){$('status').className='status';$('status').textContent='Python engine error';$('console').textContent='ENGINE ERROR:\n'+(e&&e.stack?e.stack:String(e));$('feedback').className='feedback bad';$('feedback').textContent='The Python runtime failed to load. The detailed technical error is shown below.';py=null}finally{b.disabled=false}}draw();</script></body></html>
