];let i=0,py=null,topicFilter='All',levelFilter='All',solved=new Set(),wrongAttempts={};const COURSE='BCIS 313',LAB='python-lab';let sb=null,user=null,courseId=null;async function initProgress(){try{sb=supabase.createClient(window.TAMAREEN_SUPABASE_URL,window.TAMAREEN_SUPABASE_PUBLISHABLE_KEY);const {data:ss}=await sb.auth.getSession();user=ss?.session?.user||null;if(!user)return;const {data:co}=await sb.from('courses').select('id').eq('code',COURSE).single();courseId=co?.id;if(!courseId)return;const {data:p}=await sb.from('lab_progress').select('exercise_key').eq('user_id',user.id).eq('course_id',courseId).eq('lab_type',LAB).eq('completed',true);(p||[]).forEach(x=>solved.add(Number(x.exercise_key)));draw()}catch(e){console.warn('Progress sync unavailable',e)}}async function saveProgress(n){solved.add(n);draw();if(user&&courseId)await sb.from('lab_progress').upsert({user_id:user.id,course_id:courseId,lab_type:LAB,exercise_key:String(n),exercise_title:E[n]?.[2]||'',completed:true,completed_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id,course_id,lab_type,exercise_key'})}const SESSION_SIZE=5;const $=x=>document.getElementById(x);function visible(){return E.map((q,j)=>({q,j})).filter(x=>(topicFilter==='All'||x.q[0]===topicFilter)&&(levelFilter==='All'||x.q[1]===levelFilter))}function draw(){let q=E[i];$('count').textContent=`Exercise ${(i%SESSION_SIZE)+1} of ${SESSION_SIZE}`;$('solved').textContent=`Solved: ${Math.min(solved.size,SESSION_SIZE)}/${SESSION_SIZE}`;$('level').textContent=q[1];$('topic').textContent=q[0];$('title').textContent=q[2];$('desc').textContent=q[3];$('example').textContent=q[4];$('editor').value=q[5];$('console').textContent='Ready.';$('feedback').className='feedback';let ts=['All',...new Set(E.map(q=>q[0]))];$('topics').innerHTML=ts.map(t=>`<button class="chip ${topicFilter===t?'active':''}" onclick="setTopic('${t}')">${t}</button>`).join('');let ls=['All','Beginner','Intermediate','Advanced'];$('levels').innerHTML=ls.map(t=>`<button class="chip ${levelFilter===t?'active':''}" onclick="setLevel('${t}')">${t}</button>`).join('')}function setTopic(t){topicFilter=t;let v=visible();if(v.length)i=v[0].j;draw()}function setLevel(t){levelFilter=t;let v=visible();if(v.length)i=v[0].j;draw()}function nextCode(){let v=visible(),p=v.findIndex(x=>x.j===i);i=v[(p+1)%v.length].j;draw()}function randomExercise(){let v=visible();i=v[Math.floor(Math.random()*v.length)].j;draw()}function solutionCode(n){const q=E[n];const tests=q[6]||[];const title=q[2];const known={'Average sales':'def average_sales(sales):\n    return sum(sales)/len(sales)','Highest sale':'def highest(sales):\n    return max(sales)','Above target':'def above_target(values,target):\n    return [v for v in values if v > target]','Remove duplicates':'def unique(values):\n    return list(dict.fromkeys(values))','Order total':'def order_total(order):\n    return order["price"] * order["quantity"]','Top seller':'def top_seller(data):\n    return max(data, key=data.get)','Sales summary':'def summary(sales):\n    return {"total":sum(sales),"average":sum(sales)/len(sales)}','Frequency table':'def frequency(values):\n    return {v:values.count(v) for v in dict.fromkeys(values)}','Moving average':'def moving_average(values,k):\n    return [sum(values[j:j+k])/k for j in range(len(values)-k+1)]'};return known[title]||q[5]+'\n# Review the task and replace pass with the required logic.'}function resetCode(){$('editor').value=E[i][5];$('console').textContent='Ready.';$('feedback').className='feedback'}async function engine(){if(py)return py;$('status').textContent='Loading Python engine…';py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});if(Number(py.runPython('1+1'))!==2)throw Error('Engine self-test failed');$('status').className='status ready';$('status').textContent='Python engine ready · code runs locally in this browser.';return py}async function runCode(){let b=$('run');b.disabled=true;$('console').textContent='Running…';try{let p=await engine(),q=E[i],code=$('editor').value;p.globals.set('USER_CODE',code);p.globals.set('TESTS_JSON',JSON.stringify(q[6]));await p.runPythonAsync(`import io,contextlib,json,traceback\nout=io.StringIO()\ntry:\n ns={}\n with contextlib.redirect_stdout(out): exec(USER_CODE,ns)\n printed=out.getvalue().strip(); rr=[]\n for t in json.loads(TESTS_JSON):\n  got,expected=(printed,t[1]) if t[0]=='out' else (eval(t[1],ns),t[2])\n  ok=(got==expected) or (isinstance(got,(int,float)) and isinstance(expected,(int,float)) and abs(got-expected)<1e-9)\n  rr.append([ok,repr(got),repr(expected)])\n RESULT_JSON=json.dumps({'ok':all(r[0] for r in rr),'r':rr,'printed':printed})\nexcept Exception: RESULT_JSON=json.dumps({'ok':False,'error':traceback.format_exc()})`);let r=JSON.parse(String(p.globals.get('RESULT_JSON')));if(r.error){$('console').textContent=r.error;$('feedback').className='feedback bad';wrongAttempts[i]=(wrongAttempts[i]||0)+1;$('feedback').textContent='Python reported an error. Fix it and run again.'+(wrongAttempts[i]>=3?' Correct code:\n'+solutionCode(i):'')}else{$('console').textContent=r.r.map((a,j)=>`Test ${j+1}: ${a[0]?'PASS':'FAIL'} · got ${a[1]} · expected ${a[2]}`).join('\n')+(r.printed?'\n\nOutput:\n'+r.printed:'');$('feedback').className='feedback '+(r.ok?'good':'bad');$('feedback').textContent=r.ok?'Correct! All hidden tests passed.':'Not correct yet. Review the failed test(s).';if(r.ok)saveProgress(i);else{wrongAttempts[i]=(wrongAttempts[i]||0)+1;if(wrongAttempts[i]>=3)$('feedback').textContent+=' Correct code:\n'+solutionCode(i)}$('solved').textContent=`Solved: ${solved.size}/${E.length}`}}catch(e){$('console').textContent='ERROR:\n'+String(e);$('feedback').className='feedback bad';$('feedback').textContent='The checker encountered an error.'}finally{b.disabled=false}}draw();initProgress();</script></body></html>
