<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCIS 411 · BI Analytics Lab · tamareen</title><style>*{box-sizing:border-box;font-weight:400!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f9fb;color:#173746}.stripe{height:5px;background:linear-gradient(90deg,#004f6e,#83ccea,#08799c)}header{background:#fff;border-bottom:1px solid #dce9ee}.head,main{max-width:1100px;margin:auto}.head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.brand{color:#004f6e;font-size:22px;text-decoration:none}.back{color:#004f6e;background:#edf5f7;padding:10px 13px;border-radius:10px;text-decoration:none;font-size:13px}main{padding:34px 20px 70px}.ey{font-size:11px;letter-spacing:1.2px;color:#08799c}h1{color:#004f6e;margin:8px 0}.sub{color:#6b8089;line-height:1.7;max-width:760px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.stat{background:#fff;border:1px solid #dce9ee;border-radius:12px;padding:10px 14px;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid #cfe5ed;background:#fff;color:#004f6e;border-radius:999px;padding:8px 12px;cursor:pointer}.chip.on{background:#004f6e;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#fff;border:1px solid #dce9ee;border-radius:18px;padding:20px}.tag{font-size:10px;color:#08799c;letter-spacing:.7px}.card h3{margin:7px 0;color:#004f6e;font-size:16px}.card p{color:#6b8089;font-size:13px;line-height:1.6;min-height:42px}.task{background:#f7fcfe;border:1px solid #dce9ee;border-radius:12px;padding:13px;font-size:13px;line-height:1.6}.opts{display:grid;gap:7px;margin-top:12px}.opt{border:1px solid #dce9ee;background:#fff;border-radius:10px;padding:10px;text-align:left;cursor:pointer;color:#173746}.opt.good{border-color:#82cfb1;background:#effaf5}.opt.bad{border-color:#e5a0a0;background:#fff3f3}.feedback{font-size:12px;margin-top:9px;min-height:18px}.done{color:#147a54}.wrong{color:#b43d3d}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{padding:12px 14px}main{padding:26px 14px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script></head><body><div class="stripe"></div><header><div class="head"><a class="brand" href="/">tamareen</a><a class="back" href="/courses/bcis411">← Back to course</a></div></header><main><div class="ey">BCIS 411 · HANDS-ON LAB</div><h1>BI Analytics Lab</h1><p class="sub">Practice business intelligence decisions using KPIs, visualization, data warehousing, dashboards and analytics scenarios aligned with the course.</p><div class="stats"><div class="stat"><span id="done">0</span> / <span id="total"></span> completed</div><div class="stat">Instant feedback</div><div class="stat">Course-aligned scenarios</div></div><div class="filters"><button class="chip on" onclick="filter('All',this)">All</button><span id="chips"></span></div><div class="grid" id="grid"></div></main><script>const DATA=[{"cat":"BI Foundations","title":"From Data to Decision","context":"BI transforms data into information that supports decisions.","q":"A manager wants to know whether monthly sales are above target. Which output is most useful?","options":["A KPI comparing actual sales with target","A list of every raw transaction with no summary","An unrelated employee directory","A blank dashboard"],"a":0,"explain":"A KPI directly connects measured performance to a business target."},{"cat":"KPIs","title":"Choose a KPI","context":"KPIs should align with the decision objective.","q":"For monitoring customer retention, which measure is most relevant?","options":["Customer retention/churn rate","Number of database columns","Screen resolution","Office floor area"],"a":0,"explain":"Retention or churn directly measures whether customers remain with the business."},{"cat":"Visualization","title":"Trend Visualization","context":"Visualization choice should fit the analytical question.","q":"You need to show monthly revenue over two years. Which visualization is most appropriate?","options":["Line chart","Single pie chart with 24 slices","Unsorted text list","Gauge for every month"],"a":0,"explain":"A line chart is well suited to showing change over time."},{"cat":"Visualization","title":"Category Comparison","context":"BI dashboards often compare performance across categories.","q":"Which visual best supports comparing sales across six product categories?","options":["Bar/column chart","Map with no geography","Long paragraph","Random icons"],"a":0,"explain":"Bars make magnitude comparisons across discrete categories clear."},{"cat":"Data Warehousing","title":"Historical Analysis","context":"Data warehouses support integrated historical analysis.","q":"Why might a BI team use a data warehouse instead of querying operational systems for every dashboard?","options":["To support integrated, historical analytical workloads","To eliminate all business rules","To prevent any reporting","To replace every source transaction"],"a":0,"explain":"Warehousing organizes integrated historical data for analytics and reporting."},{"cat":"Data Warehousing","title":"Dimension or Measure?","context":"Analytical models distinguish descriptive dimensions from numeric measures.","q":"In sales analysis, which is most naturally a measure?","options":["Sales amount","Customer region","Product category","Calendar month name"],"a":0,"explain":"Sales amount is numeric and can be aggregated; the others commonly describe dimensions."},{"cat":"Analytics","title":"Descriptive Analytics","context":"Different analytics types answer different questions.","q":"A dashboard summarizes what sales happened last quarter. What type of analytics is this primarily?","options":["Descriptive","Prescriptive","Optimization only","None"],"a":0,"explain":"Descriptive analytics summarizes what happened."},{"cat":"Analytics","title":"Predictive Question","context":"Predictive analytics estimates likely future outcomes.","q":"Which question is predictive?","options":["Which customers are likely to churn next month?","What were total sales last month?","Which policy should we choose under constraints?","How many rows are in yesterday's file?"],"a":0,"explain":"Estimating future churn is a predictive task."},{"cat":"Dashboards","title":"Executive Dashboard","context":"Dashboards should focus attention on decision-relevant information.","q":"An executive dashboard has 45 unrelated metrics on one screen. What improvement is most appropriate?","options":["Prioritize a smaller set of decision-relevant KPIs","Add more unrelated metrics","Remove labels","Use a different color for every number"],"a":0,"explain":"Effective dashboards emphasize relevant measures and reduce unnecessary cognitive load."},{"cat":"Dashboards","title":"Drill-down","context":"BI can move from summary indicators to more detailed views.","q":"Revenue is below target. The manager clicks the KPI to inspect region and product details. What capability is being used?","options":["Drill-down analysis","Data deletion","Payroll processing","Source-code compilation"],"a":0,"explain":"Drill-down moves from a summary view into more detailed dimensions."}];let solved=new Set();const cats=[...new Set(DATA.map(x=>x.cat))];document.getElementById('total').textContent=DATA.length;document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip" onclick="filter(\''+c+'\',this)">'+c+'</button>').join('');function render(list=DATA){document.getElementById('grid').innerHTML=list.map((x,i)=>{const real=DATA.indexOf(x);return '<div class="card"><div class="tag">'+x.cat.toUpperCase()+' · PRACTICE '+(real+1)+'</div><h3>'+x.title+'</h3><p>'+x.context+'</p><div class="task">'+x.q+'</div><div class="opts">'+x.options.map((o,j)=>'<button class="opt" onclick="check('+real+','+j+',this)">'+o+'</button>').join('')+'</div><div class="feedback" id="f'+real+'"></div></div>'}).join('')}function check(i,j,b){const x=DATA[i],card=b.closest('.card');card.querySelectorAll('.opt').forEach((el,k)=>{el.disabled=true;if(k===x.a)el.classList.add('good')});const f=document.getElementById('f'+i);if(j===x.a){solved.add(i);f.className='feedback done';f.textContent='Correct. '+x.explain}else{b.classList.add('bad');f.className='feedback wrong';f.textContent='Not quite. '+x.explain}document.getElementById('done').textContent=solved.size}function filter(c,b){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(c==='All'?DATA:DATA.filter(x=>x.cat===c))}render();initProgress();</script></body></html>
