<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Progress · tamareen</title><style>:root{--d:#004f6e;--l:#83ccea;--bg:#f4f9fb;--tx:#173746;--mu:#6b8089;--ln:#dce9ee}*{box-sizing:border-box;font-weight:400!important}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}header{background:#fffffff2;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:2}.head,main{max-width:1160px;margin:auto}.head{padding:13px 20px;display:flex;justify-content:space-between;align-items:center}.brandwrap{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:13px;background:#082f40;display:grid;place-items:center;color:#8bdaf2;font:400 18px ui-monospace,SFMono-Regular,Menlo,monospace!important}.brand{color:var(--d);font-size:24px}.brand span{display:block;color:var(--mu);font-size:11px;margin-top:5px}.nav{display:flex;gap:8px;align-items:center}.navlink{background:#edf5f7;color:var(--d);border-radius:10px;padding:10px 13px;text-decoration:none;font-size:13px}.gh{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff}.gh svg{width:20px;height:20px;fill:currentColor}main{padding:40px 20px 70px}.ey{font-size:12px;letter-spacing:1.4px;color:var(--d)}h1{font-size:38px;margin:9px 0}.sub{color:var(--mu);line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:30px 0}.stat,.card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:22px}.stat b{font-size:32px;color:var(--d)}.stat span{display:block;color:var(--mu);font-size:12px;margin-top:6px}.card h2{font-size:18px;color:var(--d);margin-top:0}.row{display:grid;grid-template-columns:1fr 100px 100px 100px;gap:10px;padding:13px 0;border-bottom:1px solid var(--ln);font-size:13px}.muted{color:var(--mu)}.empty{color:var(--mu);padding:15px 0}@media(max-width:650px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr 70px 70px 70px;font-size:11px}} </style></head><body><header><div class="head"><div class="brandwrap"><div class="mark">&lt;/&gt;</div><div class="brand">tamareen<span>Interactive learning & self-assessment</span></div></div><nav class="nav"><a class="navlink" href="index.html">Courses</a><a class="navlink" href="resources.html">Resources</a><a class="navlink" id="authBtn" href="login.html">Login</a><a class="gh" href="https://github.com/m-alshehri" target="_blank" rel="noopener" aria-label="GitHub"><svg viewBox="0 0 24 24"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.2c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg></a></nav></div></header><main><div class="ey">LEARNING ACTIVITY</div><h1>My Progress</h1><p class="sub">Your saved practice activity and recent results.</p><div class="stats"><div class="stat"><b id="attempts">—</b><span>Completed attempts</span></div><div class="stat"><b id="avg">—</b><span>Average score</span></div><div class="stat"><b id="best">—</b><span>Best score</span></div></div><div class="card"><h2>Recent attempts</h2><div class="row"><b>Course</b><b>Score</b><b>Mode</b><b>Date</b></div><div id="list" class="empty">Loading progress…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>async function load(){const list=document.getElementById('list');try{const client=supabase.createClient(window.TAMAREEN_SUPABASE_URL,window.TAMAREEN_SUPABASE_PUBLISHABLE_KEY);let {data:s}=await client.auth.getSession();if(!s?.session){location.href='login.html?next='+encodeURIComponent('dashboard.html');return}const {data,error}=await client.from('attempts').select('score_percent,mode,completed_at,courses(code,name)').eq('user_id',s.session.user.id).not('completed_at','is',null).order('completed_at',{ascending:false}).limit(30);if(error)throw error;const rows=data||[];document.getElementById('authBtn').textContent='Logout';document.getElementById('authBtn').href='#';document.getElementById('authBtn').onclick=async e=>{e.preventDefault();await client.auth.signOut();location.href='login.html'};document.getElementById('attempts').textContent=rows.length;document.getElementById('avg').textContent=rows.length?Math.round(rows.reduce((a,x)=>a+Number(x.score_percent||0),0)/rows.length)+'%':'—';document.getElementById('best').textContent=rows.length?Math.max(...rows.map(x=>Number(x.score_percent||0)))+'%':'—';list.innerHTML=rows.length?rows.map(x=>'<div class="row"><span>'+x.courses.code+'</span><span>'+Math.round(x.score_percent)+'%</span><span>'+x.mode+'</span><span>'+new Date(x.completed_at).toLocaleDateString()+'</span></div>').join(''):'No completed attempts yet. Start a course to build your progress.'}catch(e){list.textContent='Progress is not available yet. If anonymous sign-in is disabled in Supabase Auth, enable Anonymous Sign-Ins and refresh.'}}load()</script></body></html>
